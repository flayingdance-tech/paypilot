<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PayPilot — AI Checkout Agent</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --accent:#0070e0; --text:#e2e8f0; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg);
         color:var(--text); display:flex; flex-direction:column; height:100vh; }
  header { padding:16px 24px; background:var(--card); font-weight:700;
           font-size:18px; border-bottom:1px solid #334155; }
  header span { color:#60a5fa; }
  #chat { flex:1; overflow-y:auto; padding:20px; display:flex;
          flex-direction:column; gap:12px; max-width:720px; width:100%;
          margin:0 auto; }
  .msg { max-width:85%; padding:12px 16px; border-radius:14px; line-height:1.5; }
  .bot { background:var(--card); align-self:flex-start; }
  .user { background:var(--accent); align-self:flex-end; color:#fff; }
  .msg a { color:#93c5fd; }
  #bar { display:flex; gap:8px; padding:16px; max-width:720px; width:100%;
         margin:0 auto; }
  #inp { flex:1; padding:12px 16px; border-radius:10px; border:1px solid #334155;
         background:var(--card); color:var(--text); font-size:15px; }
  #send { padding:12px 24px; border:none; border-radius:10px;
          background:var(--accent); color:#fff; font-size:15px; cursor:pointer; }
  #mode { text-align:center; font-size:12px; color:#64748b; padding-bottom:8px; }
</style>
</head>
<body>
<header>🤖 <span>PayPilot</span> — AI Agentic Checkout · PayPal AI Hackathon 2026</header>
<div id="chat"></div>
<div id="mode">checking backend…</div>
<div id="bar">
  <input id="inp" placeholder="Try: wireless headphones under $100" autocomplete="off">
  <button id="send">Send</button>
</div>
<script>
const chat = document.getElementById('chat');
const inp = document.getElementById('inp');
const sid = 's-' + Math.random().toString(36).slice(2);
function md(t){ return t
  .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
  .replace(/(^|\W)_([^_]+)_(\W|$)/g,'$1<i>$2</i>$3')
  .replace(/\*([^*\n]+)\*/g,'<i>$1</i>')
  .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank">$1</a>')
  .replace(/\n/g,'<br>'); }
function add(cls, html){ const d=document.createElement('div');
  d.className='msg '+cls; d.innerHTML=html; chat.appendChild(d);
  chat.scrollTop=chat.scrollHeight; }
async function send(){
  const v=inp.value.trim(); if(!v) return; inp.value='';
  add('user', md(v.replace(/</g,'&lt;')));
  const t=document.createElement('div'); t.className='msg bot'; t.id='typing';
  t.innerHTML='<i>PayPilot is thinking…</i>'; chat.appendChild(t);
  chat.scrollTop=chat.scrollHeight;
  try {
    const r=await fetch('/api/chat',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({session_id:sid,message:v})});
    const j=await r.json();
    t.remove(); add('bot', md(j.text||'(no reply)'));
  } catch(e){ t.remove(); add('bot','<i>Connection error — is the backend running?</i>'); }
}
document.getElementById('send').onclick=send;
inp.onkeydown=e=>{ if(e.key==='Enter') send(); };
fetch('/api/health').then(r=>r.json()).then(j=>{
  document.getElementById('mode').textContent =
    'backend ok · paypal mode: '+j.paypal_mode+' · agent '+j.agent;
  add('bot', md("👋 I'm **PayPilot**, your AI checkout agent. Tell me what you're shopping for — e.g. *'wireless headphones under $100'* — and I'll find it, then check you out with PayPal."));
}).catch(()=>{ document.getElementById('mode').textContent='backend offline'; });
</script>
</body>
</html>
